name: Layout check

# Opens the program in a real browser at 1280–1920 px, Russian UI, simple and pro
# modes, and fails when the main button is cut off, a machine card is out of reach
# or a wizard title does not fit. No secrets needed.
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tests/ui/**', '.github/workflows/ui.yml']
  pull_request:
    paths: ['src/**', 'tests/ui/**', '.github/workflows/ui.yml']

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm i playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Layout check
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/ui/layout.check.js
