<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:">
<title>Kerf Studio</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="vendor/three.min.js"></script>
<script src="vendor/clipper.js"></script>
<script src="vendor/qrcode.js"></script>
<style>
/* Layout: slicer-style shell — top bar (device · mode · 4 workflow tabs), left list pane, centre canvas with plates, right properties pane, status bar */
:root{
  --bg:#121519; --panel:#191d22; --panel-2:#20252c; --raised:#282e37; --line:#2e353f; --line-2:#3b4350;
  --fg:#e6e9ee; --muted:#8c95a4; --faint:#5e6776;
  --accent:#f0a43a; --accent-ink:#1f1405; --accent-soft:rgba(240,164,58,.15);
  --ok:#3dbd7d; --warn:#e9b949; --bad:#ec5b5b; --info:#5b9cf0;
  --bed:#171b20; --grid:#1f242b; --grid-2:#2b313a; --rapid:#7d889a; --sheet:rgba(201,156,98,.13); --sheet-line:rgba(201,156,98,.65);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --f-ui:"IBM Plex Sans",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --f-disp:"Unbounded","IBM Plex Sans",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#e7eaee; --panel:#f6f7f9; --panel-2:#eceff3; --raised:#ffffff; --line:#d5dae1; --line-2:#c3cad4;
  --fg:#1a1f26; --muted:#5a6474; --faint:#8a93a2;
  --accent:#d88912; --accent-ink:#1f1405; --accent-soft:rgba(216,137,18,.14);
  --ok:#1f9a5c; --warn:#a57a0c; --bad:#d23f3f; --info:#2f74d6;
  --bed:#fbfcfd; --grid:#eaedf1; --grid-2:#d4dae2; --rapid:#97a1b0; --sheet:rgba(190,140,80,.12); --sheet-line:rgba(160,110,50,.6);
  --shadow:0 10px 30px rgba(30,40,60,.16); color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#e7eaee; --panel:#f6f7f9; --panel-2:#eceff3; --raised:#ffffff; --line:#d5dae1; --line-2:#c3cad4;
  --fg:#1a1f26; --muted:#5a6474; --faint:#8a93a2;
  --accent:#d88912; --accent-ink:#1f1405; --accent-soft:rgba(216,137,18,.14);
  --ok:#1f9a5c; --warn:#a57a0c; --bad:#d23f3f; --info:#2f74d6;
  --bed:#fbfcfd; --grid:#eaedf1; --grid-2:#d4dae2; --rapid:#97a1b0; --sheet:rgba(190,140,80,.12); --sheet-line:rgba(160,110,50,.6);
  --shadow:0 10px 30px rgba(30,40,60,.16); color-scheme:light;}
:root[data-theme="dark"]{color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
body.simple .pro{display:none!important}
body:not(.simple) .simple-only{display:none!important}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:15px;white-space:nowrap}
.brand b{font-weight:700}.brand span{font-weight:500;color:var(--muted)}.brand svg{color:var(--accent)}
.device{display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:5px 10px 5px 6px;cursor:pointer;min-width:0;text-align:left}
.device:hover{border-color:var(--line-2)}
.dev-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.dev-txt{display:flex;flex-direction:column;min-width:0}.dev-txt b{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.dev-txt small{color:var(--muted);font-size:11px;font-family:var(--f-mono);white-space:nowrap}
.tabs{display:flex;gap:4px;margin:0 auto;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 14px 6px 8px;border-radius:9px;cursor:pointer;color:var(--muted)}
.tabs button i{font-style:normal;font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line-2)}
.tabs button span{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.tabs button b{font-weight:600;color:var(--fg);font-size:13px}.tabs button small{font-size:10.5px}
.tabs button:hover{background:var(--raised)}
.tabs button[aria-selected="true"]{background:var(--raised);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tabs button[aria-selected="true"] i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.acts{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 9px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg.full{display:flex}.seg.full button{flex:1}
.modeseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;color:var(--fg);flex:none}
.icon-btn:hover{border-color:var(--line-2);background:var(--raised)}
.icon-btn:disabled{opacity:.4;cursor:default}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:8px 16px;border-radius:9px;cursor:pointer;white-space:nowrap}
.primary:hover{filter:brightness(1.07)}.primary:disabled{opacity:.5;cursor:default}

/* work area */
.work{display:grid;grid-template-columns:272px minmax(0,1fr) 312px;min-height:0}
.pane{background:var(--panel);overflow:auto;min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec.grow{flex:1;min-height:0}
.sec h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h3 .sp{flex:1}.sec h3 em{font-style:normal;font-family:var(--f-mono);letter-spacing:0;text-transform:none;color:var(--faint)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:11.5px;color:var(--muted)}
.inp{display:flex;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;min-width:0}
.inp:focus-within{border-color:var(--accent)}
.inp input,.inp select{flex:1;min-width:0;border:0;background:none;padding:6px 8px;font-family:var(--f-mono);font-size:12.5px;outline:none;font-variant-numeric:tabular-nums}
.inp select{font-family:var(--f-ui)}
.inp em{font-style:normal;color:var(--faint);font-size:11px;padding-right:8px;font-family:var(--f-mono);white-space:nowrap}
select.plain,input.plain,textarea.plain{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
textarea.plain{font-family:var(--f-mono);font-size:12px;min-height:64px;resize:vertical}
select.plain:focus,input.plain:focus,textarea.plain:focus{border-color:var(--accent);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:12.5px;white-space:nowrap;min-width:0}
.btn:hover{border-color:var(--line-2);background:var(--raised)}
.btn.acc{border-color:var(--accent);color:var(--accent)}.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}.btn.block{width:100%}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0;flex:none}
input[type=range]{accent-color:var(--accent);width:100%}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin:0}
.note b{color:var(--fg);font-weight:500}
.kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line-2);border-radius:4px;padding:0 4px;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;min-width:0;border:1px solid transparent}
.li:hover{background:var(--panel-2)}
.li.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.li .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.li.off{opacity:.5}
.li input[type=checkbox]{accent-color:var(--accent);margin:0}
.sw{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
.mini{width:24px;height:24px;display:grid;place-items:center;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted);flex:none}
.mini:hover{background:var(--raised);color:var(--fg)}.mini:disabled{opacity:.3}
.pill{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.mut{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.warnbox{display:flex;flex-direction:column;gap:6px}
.warnbox div{font-size:12px;padding:7px 9px;border-radius:7px;background:color-mix(in srgb,var(--warn) 12%,transparent);border-left:3px solid var(--warn)}

/* wizards */
.wiz{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wiz button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 10px;cursor:pointer;min-width:0}
.wiz button:hover{border-color:var(--accent);background:var(--raised)}
.wiz button svg{color:var(--accent);flex:none}
.wiz button b{font-size:12.5px;font-weight:600;line-height:1.2}
.wiz button small{font-size:11px;color:var(--muted);line-height:1.3}
.wiz button.hero{grid-column:span 2;flex-direction:row;align-items:center;gap:10px;background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.wiz button.hero span{display:flex;flex-direction:column;gap:2px}
.wiz.compact button{flex-direction:row;align-items:center;padding:7px 9px}
.wiz.compact button small{display:none}
.wiz.compact button.hero small{display:block}

/* stage */
.stage{position:relative;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.float{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.toolbar{left:12px;top:12px;display:flex;flex-direction:column;padding:5px;gap:2px;max-height:calc(100% - 80px);overflow:auto}
.toolbar button{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;flex:none}
.toolbar button:hover{background:var(--panel-2);color:var(--fg)}
.toolbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toolbar hr{border:0;border-top:1px solid var(--line);margin:3px 4px}
.viewbar{right:12px;top:12px;display:flex;gap:4px;padding:4px;align-items:center}
.viewbar .icon-btn{border:0;background:none;width:30px;height:30px}
.viewbar .icon-btn:hover{background:var(--panel-2)}
.viewbar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.viewbar .btn{border:0;background:none;padding:5px 8px}
.viewbar .btn:hover{background:var(--panel-2)}
.palette{right:12px;bottom:12px;display:flex;gap:4px;padding:6px;align-items:center;max-width:calc(58% - 24px);overflow-x:auto}
.palette button{min-width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer;font-family:var(--f-mono);font-size:9.5px;font-weight:700;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.45);padding:0 6px;flex:none}
.palette button.cur{border-color:var(--fg)}
.palette button.wide{font-family:var(--f-ui);font-size:11.5px;font-weight:600;padding:0 10px}
.palette span{font-size:11px;color:var(--muted);padding:0 6px 0 4px;white-space:nowrap}
.plates{left:12px;bottom:12px;display:flex;gap:4px;padding:5px;align-items:center;max-width:calc(42% - 12px);overflow-x:auto}
.plates button{height:28px;min-width:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:12px;padding:0 9px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.plates button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.plates button small{font-family:var(--f-mono);color:var(--muted);font-size:10.5px}
.playbar{left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;padding:8px 12px}
.playbar .time{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.playbar input[type=range]{flex:1;min-width:60px}

/* machine view */
.mach{position:absolute;inset:0;overflow:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h4{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.dro{display:grid;gap:6px}
.dro .ax{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.dro .ax b{font-family:var(--f-disp);font-size:15px;color:var(--accent)}
.dro .ax span{font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.jog{display:grid;grid-template-columns:repeat(3,52px) 16px 52px;grid-template-rows:repeat(3,52px);gap:6px;justify-content:center}
.jog button{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;cursor:pointer;font-family:var(--f-mono);font-weight:500;font-size:12px}
.jog button:hover{background:var(--raised);border-color:var(--line-2)}
.jog button:active{background:var(--accent-soft);border-color:var(--accent)}
.jog .home{color:var(--accent)}
.console{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;height:170px;overflow:auto;padding:8px 10px;font-family:var(--f-mono);font-size:11.5px;line-height:1.55}
.console .tx{color:var(--accent)}.console .rx{color:var(--muted)}.console .er{color:var(--bad)}
#mcv{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:9px;border:1px solid var(--line);display:block;background:var(--bed)}
.prog{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv span{color:var(--muted)}.kv b{font-weight:500;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
.stat span{display:block;font-size:11px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.stat.big{grid-column:span 2}.stat.big b{font-size:24px;color:var(--accent)}
.macros{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}

/* gcode list */
.gcwrap{flex:1;min-height:240px;display:flex;flex-direction:column}
#gcList{flex:1;overflow:auto;position:relative;font-family:var(--f-mono);font-size:11.5px;min-height:200px}
#gcInner{position:relative}
.gl{position:absolute;left:0;right:0;height:19px;display:flex;gap:10px;padding:0 12px 0 0;white-space:pre;cursor:pointer;align-items:center}
.gl b{width:52px;text-align:right;color:var(--faint);font-weight:400;flex:none;font-variant-numeric:tabular-nums}
.gl:hover{background:var(--panel-2)}.gl.on{background:var(--accent-soft)}.gl.on b{color:var(--accent)}
.gl code{font-family:inherit}
.c-g{color:var(--info)}.c-m{color:var(--bad)}.c-c{color:var(--faint);font-style:italic}.c-f{color:var(--muted)}.c-l{color:var(--accent)}
.legend{display:flex;flex-direction:column;gap:6px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px}
.legend i{width:18px;height:3px;border-radius:2px;flex:none}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--rapid) 0 4px,transparent 4px 7px)}

/* status */
.status{display:flex;align-items:center;gap:16px;padding:5px 16px;background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);min-width:0}
.status .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.status .hint{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status button{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;padding:2px 6px;border-radius:5px;display:inline-flex;align-items:center;gap:4px}
.status button:hover{background:var(--panel-2);color:var(--fg)}
.status button[aria-pressed="true"]{color:var(--accent)}

/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(8,10,14,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(660px,100%);max-height:calc(100% - 16px);overflow:auto;display:flex;flex-direction:column}
.dialog.xl{width:min(1220px,100%);height:min(820px,100%)}
.dialog header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
.dialog header h2{margin:0;font-size:15px;flex:1;font-family:var(--f-disp);font-weight:500}
.dialog .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-height:0}
.dialog.xl .body{padding:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;overflow:hidden}
.dialog footer{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.dialog footer .note{flex:1;min-width:180px}
.ws-view{position:relative;background:var(--bed);min-height:320px;min-width:0}
.ws-view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ws-view .float{top:12px;left:12px;padding:4px;display:flex;gap:4px}
.ws-view .badge{position:absolute;left:12px;bottom:12px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;max-width:calc(100% - 24px)}
.ws-side{overflow:auto;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.preset{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.preset:hover{border-color:var(--line-2)}.preset.on{border-color:var(--accent);background:var(--accent-soft)}
.preset b{font-size:12.5px;font-weight:600}.preset small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line-2);color:var(--fg);padding:9px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:50;font-size:12.5px;max-width:calc(100% - 32px)}
.busy{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:rgba(8,10,14,.35)}
.busy div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;font-size:13px}
.busy i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bom{font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:3px}

@media (max-width: 1180px){
  .tabs button small{display:none}
  .work{grid-template-columns:240px minmax(0,1fr) 284px}
}
@media (max-width: 900px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  .top{flex-wrap:wrap;gap:10px}
  .tabs{order:3;width:100%;margin:0}
  .tabs button{flex:1;justify-content:center;padding:6px}
  .dev-txt small{display:none}
  .acts{margin-left:auto;flex-wrap:wrap}
  .work{grid-template-columns:minmax(0,1fr)}
  .stage{height:64vh;min-height:400px;order:-1;border-bottom:1px solid var(--line)}
  #left,#right{border:0;border-bottom:1px solid var(--line);overflow:visible}
  .mach{grid-template-columns:minmax(0,1fr);position:static}
  .stage.machmode{height:auto;min-height:0}
  .status{flex-wrap:wrap;gap:8px}
  .palette{left:12px;right:12px;bottom:56px;max-width:none}
  .plates{max-width:calc(100% - 24px)}
  .palette span{display:none}
  .dialog.xl{height:auto}
  .dialog.xl .body{display:flex;flex-direction:column;overflow:visible}
  .ws-view{height:52vh}
  .ws-side{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width: 480px){
  .brand span{display:none}
  .primary{padding:8px 11px}
  .jog{grid-template-columns:repeat(3,46px) 10px 46px;grid-template-rows:repeat(3,46px)}
  .wiz{grid-template-columns:1fr}.wiz button.hero{grid-column:span 1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20L12 4l8 16"/><path d="M8 14h8" stroke-dasharray="2 2.4"/></svg>
      <b>Kerf</b><span>Studio</span>
    </div>
    <button class="device" id="deviceBtn" data-act="settings"></button>
    <div class="seg modeseg" id="modeSeg"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="acts">
      <div class="seg" id="langSeg"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
      <button class="icon-btn" id="themeBtn" data-act="theme"></button>
      <button class="primary" id="primaryBtn" data-act="primary"></button>
    </div>
  </header>
  <main class="work">
    <aside class="pane" id="left"></aside>
    <section class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="float toolbar" id="toolbar"></div>
      <div class="float viewbar" id="viewbar"></div>
      <div class="float plates" id="plates"></div>
      <div class="float palette" id="palette"></div>
      <div class="float playbar" id="playbar"></div>
      <div class="mach" id="mach" hidden></div>
    </section>
    <aside class="pane" id="right"></aside>
  </main>
  <footer class="status" id="status"></footer>
</div>
<div class="modal" id="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="busy" id="busy" hidden><div><i></i><span id="busyT"></span></div></div>
<input type="file" id="fileSvg" accept=".svg,.dxf,image/svg+xml" hidden>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileGc" accept=".nc,.gcode,.gc,.ngc,.tap,.txt" hidden>
<input type="file" id="fileProj" accept=".kerf,.json" hidden>
<input type="file" id="file3d" accept=".stl,.obj" hidden>
<input type="file" id="fileGenImg" accept="image/*" hidden>

<script src="js/core.js"></script>
<script src="js/cad.js"></script>
<script src="js/cam.js"></script>
<script src="js/gen.js"></script>
<script src="js/slicer.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
