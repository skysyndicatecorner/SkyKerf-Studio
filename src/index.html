<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SkyKerf_Studio</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
<script src="vendor/three.min.js"></script>
<script src="vendor/clipper.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/utif.js"></script>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="icon-btn" id="menuBtn" data-act="menu" aria-label="Menu"></button>
    <div class="brand" title="SkyKerf_Studio">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="10" y="2" width="4" height="12" rx="2"/><path d="M2 15.5a1.5 1.5 0 0 1 1.5-1.5H10v7H3.5A1.5 1.5 0 0 1 2 19.5zM14 14h6.5a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5H14z"/></svg>
      <span class="bn"><b>SkyKerf</b><i>_Studio</i></span>
    </div>
    <button class="device" id="deviceBtn" data-act="settings"></button>
    <div class="seg modeseg" id="modeSeg"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="acts">
      <div class="hist" id="hist"></div>
      <div class="seg" id="langSeg"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
      <button class="icon-btn" id="themeBtn" data-act="theme"></button>
      <button class="icon-btn" id="helpBtn" data-act="help"></button>
      <button class="btn" id="exportBtn" data-act="export"></button>
      <button class="primary" id="primaryBtn" data-act="primary"></button>
    </div>
  </header>
  <main class="work">
    <aside class="pane" id="left"></aside>
    <section class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="float toolbar" id="toolbar"></div>
      <div class="float viewbar" id="viewbar"></div>
      <div class="float plates" id="plates"></div>
      <div class="float palette" id="palette"></div>
      <div class="float playbar" id="playbar"></div>
      <div class="mach" id="mach" hidden></div>
    </section>
    <aside class="pane" id="right"></aside>
  </main>
  <footer class="status" id="status"></footer>
</div>
<div class="modal" id="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div class="ctx" id="ctxMenu" hidden role="menu"></div>
<div class="tip" id="tip" hidden role="tooltip"></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<div class="busy" id="busy" hidden><div><i></i><span id="busyT"></span></div></div>
<div class="drop" id="drop" hidden><div><svg width="40" height="40" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 3v10M6.5 9.5L10 13l3.5-3.5"/><path d="M4 13v3.5h12V13"/></svg><b>Drop files · Перетащите файлы</b><small>SVG · DXF · PNG · JPEG · BMP · WebP · TIFF · STL · OBJ · G-code · .kerf</small></div></div>
<input type="file" id="fileAny" accept=".svg,.dxf,.png,.jpg,.jpeg,.bmp,.gif,.webp,.tif,.tiff,.stl,.obj,.nc,.gcode,.gc,.ngc,.tap,.kerf,.skykerf,.json,.pdf,.ai,.cdr,.plt,.hpgl,.hpg,.lbrn,.lbrn2,.svgz,.eps" hidden>
<input type="file" id="fileProj" accept=".kerf,.skykerf,.json" hidden>
<input type="file" id="fileImg" accept="image/*,.tif,.tiff" hidden>
<input type="file" id="fileGc" accept=".nc,.gcode,.gc,.ngc,.tap,.txt" hidden>
<input type="file" id="file3d" accept=".stl,.obj" hidden>
<input type="file" id="fileGenImg" accept="image/*,.tif,.tiff" hidden>
<input type="file" id="fileMat" accept=".json" hidden>
<input type="file" id="fileFont" accept=".ttf,.otf,.ttc,.woff,.woff2" hidden>

<script src="js/core.js"></script>
<script src="js/geom.js"></script>
<script src="js/wasm-bin.js"></script>
<script src="js/wasmcore.js"></script>
<script src="js/materials.js"></script>
<script src="js/fontname.js"></script>
<script src="js/text.js"></script>
<script src="js/nest.js"></script>
<script src="js/cam.js"></script>
<script src="js/post.js"></script>
<script src="js/cdr.js"></script>
<script src="js/vecformats.js"></script>
<script src="js/imports.js"></script>
<script src="js/impmap.js"></script>
<script src="js/gcconv.js"></script>
<script src="js/cad.js"></script>
<script src="js/decor.js"></script>
<script src="js/gen.js"></script>
<script src="js/houses.js"></script>
<script src="js/houses2.js"></script>
<script src="js/houses3.js"></script>
<script src="js/furniture.js"></script>
<script src="js/housekit.js"></script>
<script src="js/boxes.js"></script>
<script src="js/figures.js"></script>
<script src="js/awards.js"></script>
<script src="js/toys.js"></script>
<script src="js/decorgen.js"></script>
<script src="js/layered.js"></script>
<script src="js/tests.js"></script>
<script src="js/slicer.js"></script>
<script src="js/relief.js"></script>
<script src="js/devices.js"></script>
<script src="js/gamepad.js"></script>
<script src="js/help.js"></script>
<script src="js/ui.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
