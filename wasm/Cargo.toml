[package]
name = "skykerf-core"
version = "0.4.1"
edition = "2021"
license = "MIT"
description = "SkyKerf_Studio numeric kernels (dithering, blur, mesh slicing) for WebAssembly"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
codegen-units = 1
